[package]
name = "dbdock"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "One-click test database servers in Docker"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Pascold/DBDock"
readme = "README.md"
keywords = ["docker", "database", "testing", "egui", "compose"]
categories = ["development-tools", "gui"]
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
  "default_fonts",
  "glow",
  "wayland",
  "x11",
] }
egui = "0.37"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
