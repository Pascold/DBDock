[package]
name = "dbdock"
version = "0.1.1"
edition = "2021"
rust-version = "1.95"
description = "One-click test database servers in Docker"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Pascold/DBDock"
readme = "README.md"
keywords = ["docker", "database", "testing", "egui", "compose"]
categories = ["development-tools", "gui"]
publish = false

[dependencies]
arboard = { version = "3.7.0", default-features = false }
directories = "6.0.0"
eframe = { version = "0.37", default-features = false, features = [
  "clipboard",
  "default_fonts",
  "glow",
  "links",
  "wayland",
  "x11",
  "persistence",
] }
egui = "0.37"
open = "5.4.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
thiserror = "2.0.21"
toml = "1.2.3"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
# Measured on Windows x86_64: opt-level = "z" gives 5.0 MiB instead of
# 5.3 MiB (-6 %), which is not worth the slower UI code.
opt-level = 3
panic = "abort"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1.34"
